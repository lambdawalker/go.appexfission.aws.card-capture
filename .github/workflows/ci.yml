name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.3
          cache-dependency-path: |
            go.sum
            infrastructure/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go test -race ./...
        working-directory: infrastructure
      - run: go vet ./...
        working-directory: infrastructure
      - run: ./scripts/build.sh
      - run: go run ./cmd/deploy --action build
      - run: GOOS=windows GOARCH=amd64 go build -o /tmp/ocr-deploy.exe ./cmd/deploy
